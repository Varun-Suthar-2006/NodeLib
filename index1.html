<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NodeLib — Your next chapter</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"><style>
:root{--ink:#17291f;--muted:#68756e;--cream:#f8f6ee;--paper:#fffdf8;--line:#dedfd6;--green:#245b46;--lime:#dcedc8;--coral:#ee8c6f}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--cream);font-family:"DM Sans",sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1180px,calc(100% - 48px));margin:auto}header{height:82px;display:flex;align-items:center;justify-content:space-between}.logo{font-size:22px;font-weight:700;letter-spacing:-1px;display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--green);color:#fff;font:13px "DM Mono"}nav{display:flex;gap:32px}nav a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}.actions{display:flex;gap:16px;align-items:center}.saved{background:none;border:0;color:var(--ink);font-size:14px;font-weight:600}.badge{display:inline-grid;place-items:center;margin-left:5px;width:19px;height:19px;border-radius:50%;background:var(--coral);color:#fff;font:11px "DM Mono"}.primary{border:1px solid var(--green);color:#fff;background:var(--green);padding:11px 18px;border-radius:8px;font-weight:600;font-size:14px;transition:.2s}.primary:hover{transform:translateY(-2px);background:#174533}.hero{min-height:590px;display:grid;grid-template-columns:1.08fr .92fr;gap:64px;align-items:center;padding:52px 0 76px}.eyebrow{color:var(--green);font:12px "DM Mono";letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:9px}.eyebrow:before{content:"";height:1px;width:28px;background:currentColor}h1{font:600 clamp(48px,6vw,78px)/.98 "Playfair Display";letter-spacing:-3px;margin:20px 0 25px}h1 em{color:var(--green)}.intro{max-width:520px;font-size:17px;line-height:1.65;color:var(--muted)}.cta{display:flex;gap:18px;align-items:center;margin-top:31px}.link{border:0;background:none;color:var(--green);font-weight:600}.art{height:430px;position:relative;display:grid;place-items:center}.sun{width:315px;height:315px;background:var(--lime);border-radius:50%;position:absolute}.stack{width:260px;height:335px;z-index:1;position:relative;transform:rotate(5deg)}.hero-book{position:absolute;width:190px;height:265px;border-radius:5px 14px 14px 5px;box-shadow:18px 17px 20px #31513b30;padding:27px 22px;display:flex;flex-direction:column;justify-content:space-between;color:#fffdf4}.hero-book:after{content:"";position:absolute;left:0;top:0;bottom:0;width:13px;background:#00000018}.hero-book small,.hero-book b{z-index:1}.hero-book small{font:11px "DM Mono";letter-spacing:.08em}.hero-book b{font:600 30px/1.05 "Playfair Display"}.back{background:#d77c69;transform:rotate(-13deg);top:48px;left:0}.front{background:#28604a;right:0;top:4px}.trust{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:23px 0;display:flex;justify-content:space-between;gap:24px;align-items:center;color:var(--muted)}.trust-label{font-size:13px;max-width:190px}.stats{display:flex;gap:clamp(25px,7vw,90px)}.stat b{display:block;color:var(--green);font:22px "Playfair Display"}.stat span{font-size:12px}section{padding:100px 0}.section-title{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:32px}.section-title h2{font:600 clamp(34px,4vw,48px)/1.1 "Playfair Display";letter-spacing:-1.5px;margin:11px 0 0}.section-title p{color:var(--muted);max-width:330px;line-height:1.55;font-size:14px}.categories,.books{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.category{min-height:178px;padding:20px;border:1px solid var(--line);border-radius:12px;background:var(--paper);display:flex;flex-direction:column;justify-content:space-between;transition:.25s}.category:hover{transform:translateY(-5px);border-color:var(--green)}.category i{font-style:normal;font-size:29px}.category b{font:20px "Playfair Display";display:block}.category span{font-size:13px;color:var(--muted)}.discover{background:#e8eee2}.toolbar{display:flex;justify-content:space-between;gap:20px;margin-bottom:29px;align-items:center}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px}.filter.active,.filter:hover{color:#fff;background:var(--green);border-color:var(--green)}.search{width:250px;border:1px solid var(--line);border-radius:8px;padding:10px 13px;background:#fffdf8;outline:none}.book{background:var(--paper);padding:13px;border-radius:11px;border:1px solid #dce0d7}.cover{height:254px;padding:21px 18px;border-radius:5px 10px 10px 5px;color:#fffdf5;box-shadow:7px 8px 13px #20362b24;position:relative;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.cover:before{content:"";position:absolute;width:150px;height:150px;border:1px solid #ffffff50;border-radius:50%;right:-55px;top:-48px}.cover small,.cover strong{z-index:1}.cover small{font:11px "DM Mono";letter-spacing:.08em}.cover strong{font:600 25px/1.05 "Playfair Display";max-width:150px}.info{padding:16px 3px 4px}.info h3{margin:0 0 4px;font-size:15px}.info p{margin:0;color:var(--muted);font-size:12px}.book-foot{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.rating{font-size:12px;color:#a16a15}.heart{border:0;background:none;color:var(--green);font-size:20px;padding:0}.heart.active{color:var(--coral)}.empty{grid-column:1/-1;padding:40px;text-align:center;color:var(--muted)}.membership{background:var(--green);color:#f9f7ed}.membership .eyebrow{color:#d5ebb8}.member{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:center}.member h2{font:600 48px/1.1 "Playfair Display";letter-spacing:-1.5px;margin:13px 0 28px}.perks{display:grid;gap:17px}.perk{display:flex;gap:14px;align-items:center}.perk i{font-style:normal;color:var(--lime);font-size:20px}.perk b{display:block;font-size:15px}.perk span{font-size:13px;color:#c6d4cb}.member-card{background:#f8f6ee;color:var(--ink);border-radius:16px;padding:28px;transform:rotate(2deg);box-shadow:14px 16px 0 #163d2e}.member-card h3{font:28px "Playfair Display";margin:8px 0}.member-card p{color:var(--muted)}.member-card .primary{margin-top:16px;width:100%}footer{padding:37px 0;display:flex;justify-content:space-between;color:var(--muted);font-size:13px}@media(max-width:760px){.shell{width:min(100% - 32px,1180px)}nav{display:none}.hero{grid-template-columns:1fr;padding-top:35px;gap:20px}.art{height:315px;transform:scale(.8)}.trust{align-items:flex-start}.stats{gap:16px;flex-wrap:wrap}.categories,.books{grid-template-columns:repeat(2,1fr)}.section-title,.toolbar{display:block}.section-title p{margin-top:14px}.search{width:100%;margin-top:15px}.member{grid-template-columns:1fr;gap:32px}.cover{height:210px}}@media(max-width:430px){.actions .primary{display:none}.categories,.books{grid-template-columns:1fr}.trust{display:block}.stats{margin-top:18px}}
</style></head><body><div id="root"></div><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script type="text/babel">
const {useState,useMemo}=React;const books=[['The Quiet Mind','Mira Patel','Wellbeing','#b66e5a','4.9'],['Designing for Wonder','Olive Laurent','Design','#416c8e','4.8'],['A Map of Small Things','Theo James','Fiction','#c39542','4.7'],['The Next Good Idea','Aarav Mehta','Business','#315d48','4.9'],['Under Open Skies','Nora Smith','Fiction','#566694','4.6'],['Make Room','Lin Chen','Wellbeing','#977657','4.8'],['The Art of Systems','Jon Bell','Technology','#373e57','4.7'],['Light in the Library','Evelyn Ross','Fiction','#a15362','4.9']].map(([title,author,genre,color,rating],id)=>({id,title,author,genre,color,rating}));
function App(){const [filter,setFilter]=useState('All'),[query,setQuery]=useState(''),[saved,setSaved]=useState([]);const result=useMemo(()=>books.filter(b=>(filter==='All'||b.genre===filter)&&(b.title+' '+b.author).toLowerCase().includes(query.toLowerCase())),[filter,query]);const toggle=id=>setSaved(x=>x.includes(id)?x.filter(n=>n!==id):[...x,id]);return <><div className="shell"><header><div className="logo"><span className="mark">N</span>NodeLib</div><nav><a href="#discover">Discover</a><a href="#collections">Collections</a><a href="#membership">Membership</a></nav><div className="actions"><button className="saved" onClick={()=>document.querySelector('#discover').scrollIntoView()}>My shelf <span className="badge">{saved.length}</span></button><button className="primary">Join NodeLib</button></div></header><main><section className="hero"><div><div className="eyebrow">Your digital reading room</div><h1>More than books.<br/>A place to <em>belong.</em></h1><p className="intro">Thoughtfully chosen stories and ideas for curious minds. Find a book that feels like it was waiting for you.</p><div className="cta"><button className="primary" onClick={()=>document.querySelector('#discover').scrollIntoView()}>Explore the library</button><button className="link" onClick={()=>document.querySelector('#collections').scrollIntoView()}>How it works →</button></div></div><div className="art"><div className="sun"></div><div className="stack"><div className="hero-book back"><small>NODELIB EDITIONS</small><b>Make space for wonder.</b><small>VOL. 02</small></div><div className="hero-book front"><small>THE READING LIFE</small><b>There is always another page.</b><small>NODELIB — 2026</small></div></div></div></section><div className="trust"><div className="trust-label">A community for people who still believe in getting lost in a good book.</div><div className="stats"><div className="stat"><b>12,000+</b><span>carefully picked titles</span></div><div className="stat"><b>48k</b><span>readers finding their next</span></div><div className="stat"><b>4.9/5</b><span>from our community</span></div></div></div></main></div><section id="collections"><div className="shell"><div className="section-title"><div><div className="eyebrow">Find your corner</div><h2>Every reader has a doorway.</h2></div><p>Browse a collection made to meet you where you are — and take you somewhere new.</p></div><div className="categories">{[['✦','Fiction','Stories that stay with you'],['⌁','Wellbeing','For a slower, fuller life'],['◫','Business','Ideas built for action'],['⌘','Technology','The world, explained']].map(c=><div className="category" key={c[1]}><i>{c[0]}</i><div><b>{c[1]}</b><span>{c[2]}</span></div></div>)}</div></div></section><section className="discover" id="discover"><div className="shell"><div className="section-title"><div><div className="eyebrow">On our shelves</div><h2>Good books, right now.</h2></div><p>Handpicked favourites from readers in the NodeLib community.</p></div><div className="toolbar"><div className="filters">{['All','Fiction','Wellbeing','Business','Technology'].map(x=><button className={'filter '+(filter===x?'active':'')} onClick={()=>setFilter(x)} key={x}>{x}</button>)}</div><input className="search" value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search titles or authors"/></div><div className="books">{result.length?result.map(b=><article className="book" key={b.id}><div className="cover" style={{background:b.color}}><small>NODELIB EDITIONS</small><strong>{b.title}</strong><small>{b.author.toUpperCase()}</small></div><div className="info"><h3>{b.title}</h3><p>{b.author}</p><div className="book-foot"><span className="rating">★ {b.rating} reader rating</span><button className={'heart '+(saved.includes(b.id)?'active':'')} onClick={()=>toggle(b.id)}>{saved.includes(b.id)?'♥':'♡'}</button></div></div></article>):<div className="empty">No books match that search. Try another title or author.</div>}</div></div></section><section id="membership" className="membership"><div className="shell member"><div><div className="eyebrow">A little closer to the shelves</div><h2>Make reading part of your everyday.</h2><div className="perks">{[['Personal reading paths','Recommendations that get better with every page.'],['Member-only editions','Beautiful books, special prices, first access.'],['A thoughtful community','Notes, lists, and conversations worth keeping.']].map(p=><div className="perk" key={p[0]}><i>✓</i><div><b>{p[0]}</b><span>{p[1]}</span></div></div>)}</div></div><div className="member-card"><div className="eyebrow">NodeLib membership</div><h3>Make space for more stories.</h3><p>Start your reading room with a 14-day complimentary membership.</p><button className="primary" onClick={()=>alert('Welcome to NodeLib — your complimentary membership is ready to begin!')}>Start reading with us</button></div></div></section><div className="shell"><footer><b>◼ NodeLib</b><span>Made for the beautifully curious · © 2026</span></footer></div></>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
